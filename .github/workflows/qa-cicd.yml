name: Enterprise DevSecOps CICD pipeline
on:                             # it will show we are using Trigger Event
 push:
   branches:
     - qa
   paths: 
     - client/**
     - server/**
     - .github/workflows/qa-cicd.yml


jobs:
  gitleaks-scan:     # Job ID so we can recall again this Job
   name: gitleaks-scan   # its like a Label
   runs-on: ubuntu-latest  # what type of Runner we need to run 
   steps:                  # we will defind the steps for gitleak 
     - name: Checkout Source Code       # cloning the repoistor 
     - uses: actions/checkout@v4        # action taken from github market place

     - name: Run Gitleaks scan
     - run: |     # we are using Pipe for run multiply shell command
         docker run --rm \
           -v “${{github.workspace }}:/repo” \
           zricethezav/gitleaks:latest detect \
           --source=repo \
           --report-format=json \
           --report-path=/repo/gitleaks-report.json \
           --redact \
           --exit-code 0
           
     - name: Upload Gitleaks report       # cloning the repoistor 
     - uses: actions/upload-artifact@v4
         with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

     
    
     
   
   
   
  
